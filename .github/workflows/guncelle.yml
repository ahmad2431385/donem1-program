name: Program verisini güncelle

on:
  # Zamanlama GitHub'da değil, cron-job.org'da: orası her gün 07:25, 10:25, 13:25, 16:25, 19:25 ve 22:25'te
  # GitHub API ile bu iş akışını başlatır (workflow_dispatch). GitHub'ın kendi
  # zamanlayıcısı saatinde çalışmadığı için kullanılmıyor.
  workflow_dispatch: {}    # Actions sekmesinden elle çalıştırma düğmesi

permissions:
  contents: write

concurrency:
  group: program-verisi
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıklar
        run: pip install openpyxl==3.1.5

      - name: Kaynakları Drive'dan indir
        run: tools/fetch.sh data

      - name: Derle ve kontrol et
        run: tools/update.sh data data.json out/data.json

      - name: Veriyi depoya kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp out/data.json data.json
            git add data.json
            git commit -q -m "Program verisi güncellendi (otomatik kontrol)" || { echo "Değişiklik yok"; exit 0; }
            git push -q origin HEAD:main && exit 0
            echo "push reddedildi, yeniden deneniyor ($i)"; sleep 5
          done
          exit 1

  # Verinin kaydedildiği hâliyle siteyi GitHub Pages'te yayınla.
  # (GITHUB_TOKEN ile yapılan push başka iş akışlarını tetiklemediği için burada açıkça çağrılır.)
  yayinla:
    needs: guncelle
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
