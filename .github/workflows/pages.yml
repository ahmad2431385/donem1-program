name: Siteyi yayınla (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  yayinla:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Site dosyalarını hazırla
        run: |
          mkdir _site
          cp index.html data.json desc.json manifest.json icon-180.png icon-512.png .nojekyll _site/
          [ -d img ] && cp -r img _site/ || true

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # GitHub tarafında geçici hatalar olabildiği için bir kez daha denenir.
      - id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Kısa bekleme (yeniden deneme öncesi)
        if: steps.deploy1.outcome == 'failure'
        run: sleep 30

      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - id: deployment
        run: echo "page_url=${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url }}" >> "$GITHUB_OUTPUT"
