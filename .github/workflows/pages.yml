name: Siteyi yayınla (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  yayinla:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Site dosyalarını hazırla
        run: |
          mkdir _site
          cp index.html data.json desc.json manifest.json icon-180.png icon-512.png icon-maskable-512.png icon.svg .nojekyll _site/
          for f in ogr.json d2.json d3.json d4.json d5.json kampus.json; do [ -f "$f" ] && cp "$f" _site/; done
          [ -d img ] && cp -r img _site/ || true

      # Yayınlanan sayfa küçültülür ve kod karıştırılır (okunması zorlaşır).
      # Bir hata olursa sayfa olduğu gibi yayınlanır; site hiçbir zaman bozulmaz.
      - name: Kodu küçült ve karıştır
        run: |
          npx --yes html-minifier-terser@7.2.0 --collapse-whitespace --conservative-collapse --remove-comments --minify-css true \
            --minify-js '{"compress":{"passes":2},"mangle":{"toplevel":true},"format":{"comments":false}}' \
            -o _site/index.min.html index.html \
            && mv _site/index.min.html _site/index.html \
            || echo "Küçültme başarısız; sayfa olduğu gibi yayınlanıyor."

      # İkinci katman: betiklerdeki adlar ve metinler şifrelenir (kod okunamaz hâle gelir).
      # Bir hata olursa küçültülmüş sayfa yayınlanır; site hiçbir zaman bozulmaz.
      - name: Betikleri karıştır
        run: |
          npm i --no-save --no-audit --no-fund --silent javascript-obfuscator@4.1.1 \
            && node tools/obfuscate.js _site/index.html _site/index.obf.html \
            && mv _site/index.obf.html _site/index.html \
            || echo "Karıştırma başarısız; küçültülmüş sayfa yayınlanıyor."

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # GitHub tarafında geçici hatalar olabildiği için bir kez daha denenir.
      - id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Kısa bekleme (yeniden deneme öncesi)
        if: steps.deploy1.outcome == 'failure'
        run: sleep 30

      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - id: deployment
        run: echo "page_url=${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url }}" >> "$GITHUB_OUTPUT"
